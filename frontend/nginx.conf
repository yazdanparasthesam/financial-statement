# Frontend container (docker compose): serves the Vite build and proxies API
# calls to the backend service — the browser only ever talks to one origin.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }
    location = /healthz { proxy_pass http://backend:8000; }
    location = /version { proxy_pass http://backend:8000; }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
