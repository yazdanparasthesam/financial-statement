name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fs
          POSTGRES_PASSWORD: fs
          POSTGRES_DB: financial_statement_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fs"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests scripts ../oncall-agent
      - name: Unit tests (pure domain — no DB, no HTTP)
        env:
          DATABASE_URL: sqlite:///./ci_unit.db
          AI_PROVIDER: mock
          JWT_SECRET: ci-secret-not-prod
        run: python -m pytest tests/unit
      - name: Integration tests (API + Postgres 16, incl. contract drift gate)
        env:
          DATABASE_URL: postgresql+psycopg://fs:fs@localhost:5432/financial_statement_ci
          AI_PROVIDER: mock
          JWT_SECRET: ci-secret-not-prod
        run: python -m pytest tests/integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Core-logic tests (vitest)
        run: npm test
      - name: Type-check + production build
        run: npm run build

  oncall-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps (agent is stdlib + PyYAML only)
        run: pip install pyyaml pytest
      - name: Responder-engine tests (allowlist, cooldown, escalation, reports)
        run: python -m pytest oncall-agent/tests -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks wants history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Secret scan (gitleaks — BLOCKS on findings)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install python scanners
        run: pip install bandit pip-audit semgrep
      - name: bandit (python security lint — report artifact)
        run: mkdir -p ../security/runs && bandit -r app -x tests -f json -o ../security/runs/ci-bandit.json --exit-zero
        working-directory: backend
      - name: pip-audit (dependency CVEs — report artifact)
        run: mkdir -p security/runs && (pip-audit -r backend/requirements.txt --format json --output security/runs/ci-pip-audit.json || true)
      - name: semgrep (pattern scan — report artifact)
        run: mkdir -p security/runs && (semgrep scan --config auto backend/app frontend/src --metrics=off --json --output security/runs/ci-semgrep.json || true)
      - name: npm audit (js advisories — report artifact)
        run: cd frontend && (npm audit --json > ../security/runs/ci-npm-audit.json || true)
      - name: trivy (filesystem CVE scan — report artifact)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: security/runs/ci-trivy.json
          severity: CRITICAL,HIGH
      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: security/runs/ci-*.json
          if-no-files-found: warn
