# Manual API rollback/redeploy of a previously CI-green commit.
# This does not mutate main. For a permanent code revert, create a normal
# `git revert` commit/PR; the standard CI-gated dev workflow will deploy it.
name: Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "API environment to restore"
        type: choice
        options: [dev, prod]
        default: dev
        required: true
      target_sha:
        description: "Full 40-character SHA of the known-good commit on main"
        required: true
      reason:
        description: "Reason for rollback (recorded in the run summary)"
        required: true

permissions:
  actions: read
  contents: read

jobs:
  rollback-dev:
    if: inputs.environment == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    concurrency:
      group: fastapi-cloud-dev
      cancel-in-progress: false
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Check out target commit and full history
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - name: Verify target is on main and has successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Provide a full 40-character commit SHA." >&2; exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor "$TARGET_SHA" origin/main || {
            echo "Target SHA must be reachable from main." >&2; exit 1;
          }
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${TARGET_SHA}&per_page=100" \
            > "$RUNNER_TEMP/ci-runs.json"
          jq -e --arg sha "$TARGET_SHA" \
            'any(.workflow_runs[]; .head_sha == $sha and .conclusion == "success")' \
            "$RUNNER_TEMP/ci-runs.json" >/dev/null || {
              echo "No successful CI run found for $TARGET_SHA" >&2; exit 1;
            }

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Redeploy known-good API commit to dev
        working-directory: backend
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
        run: |
          set -euo pipefail
          uvx --from "fastapi[standard]" fastapi deploy --app-id "$FASTAPI_CLOUD_APP_ID"

      - name: Verify dev health and lifecycle
        env:
          BASE: ${{ vars.FS_DEV_BACKEND_URL || 'https://fs-dev-api.fastapicloud.dev' }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "$BASE/healthz"; then echo; break; fi
            if [ "$attempt" -eq 18 ]; then echo "Health check failed" >&2; exit 1; fi
            sleep 10
          done
          bash ops/smoke.sh "$BASE"

      - name: Record rollback result
        env:
          REASON: ${{ inputs.reason }}
        run: |
          {
            echo "### Dev API rollback completed"
            echo "- Restored commit: \`$TARGET_SHA\`"
            echo "- Reason: $REASON"
          } >> "$GITHUB_STEP_SUMMARY"

  rollback-prod:
    if: inputs.environment == 'prod'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: fastapi-cloud-production
      cancel-in-progress: false
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Check out target commit and full history
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - name: Verify target is on main and has successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Provide a full 40-character commit SHA." >&2; exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor "$TARGET_SHA" origin/main || {
            echo "Target SHA must be reachable from main." >&2; exit 1;
          }
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${TARGET_SHA}&per_page=100" \
            > "$RUNNER_TEMP/ci-runs.json"
          jq -e --arg sha "$TARGET_SHA" \
            'any(.workflow_runs[]; .head_sha == $sha and .conclusion == "success")' \
            "$RUNNER_TEMP/ci-runs.json" >/dev/null || {
              echo "No successful CI run found for $TARGET_SHA" >&2; exit 1;
            }

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Redeploy known-good API commit to production
        working-directory: backend
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_PROD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_PROD_APP_ID }}
        run: |
          set -euo pipefail
          test -n "$FASTAPI_CLOUD_TOKEN" || { echo "Configure FASTAPI_CLOUD_PROD_TOKEN in the protected production environment" >&2; exit 1; }
          test -n "$FASTAPI_CLOUD_APP_ID" || { echo "Configure FASTAPI_CLOUD_PROD_APP_ID in the protected production environment" >&2; exit 1; }
          uvx --from "fastapi[standard]" fastapi deploy --app-id "$FASTAPI_CLOUD_APP_ID"

      - name: Verify production health and lifecycle
        env:
          BASE: ${{ vars.FS_PROD_BACKEND_URL || 'https://fs-prod-api.fastapicloud.dev' }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "$BASE/healthz"; then echo; break; fi
            if [ "$attempt" -eq 18 ]; then echo "Health check failed" >&2; exit 1; fi
            sleep 10
          done
          bash ops/smoke.sh "$BASE"

      - name: Record rollback result
        env:
          REASON: ${{ inputs.reason }}
        run: |
          {
            echo "### Production API rollback completed"
            echo "- Restored commit: \`$TARGET_SHA\`"
            echo "- Reason: $REASON"
            echo "- This run passed through the protected production environment."
          } >> "$GITHUB_STEP_SUMMARY"
