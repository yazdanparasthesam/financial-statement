# CI-gated API and frontend deployment. Dev frontend deploys in the sibling
# deploy-vercel.yml workflow after the dev API deploy. A production dispatch uses
# one protected production job to prebuild the Vercel frontend, deploy/verify the
# API, then deploy/verify the frontend at the same selected commit. Native provider
# Git deployment stays disabled so CI and the manual environment gate cannot be bypassed.
name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy target"
        type: choice
        options: [prod]
        default: prod
      sha:
        description: "Full commit SHA to deploy (blank = this workflow's commit)"
        required: false
        default: ""

permissions:
  actions: read
  contents: read

jobs:
  # ------------------------------- DEV (after green CI) ------------------------
  deploy-dev:
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    concurrency:
      group: fastapi-cloud-dev
      cancel-in-progress: false
    steps:
      - name: Check out the exact commit CI tested
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Deploy API to FastAPI Cloud
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
        run: |
          set -euo pipefail
          test -n "$FASTAPI_CLOUD_TOKEN" || { echo "FASTAPI_CLOUD_TOKEN is missing" >&2; exit 1; }
          test -n "$FASTAPI_CLOUD_APP_ID" || { echo "FASTAPI_CLOUD_APP_ID is missing" >&2; exit 1; }
          uvx --from "fastapi[standard]" fastapi deploy --app-id "$FASTAPI_CLOUD_APP_ID"

      - name: Wait for API health and run lifecycle smoke
        env:
          BASE: ${{ vars.FS_DEV_BACKEND_URL || 'https://fs-dev-api.fastapicloud.dev' }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "$BASE/healthz"; then
              echo
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "API health check failed at $BASE/healthz" >&2
              exit 1
            fi
            sleep 10
          done
          bash ops/smoke.sh "$BASE"

  # ------------------------------- PROD (manual + environment approval) --------
  deploy-prod:
    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.environment == 'prod' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: fastapi-cloud-production
      cancel-in-progress: false
    env:
      DEPLOY_SHA: ${{ inputs.sha || github.sha }}
    steps:
      - name: Check out the requested production commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0

      - name: Require the selected SHA to be on main
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/main || {
            echo "The production SHA must already be reachable from main." >&2
            exit 1
          }

      - name: Verify the selected commit has a successful CI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Provide a full 40-character commit SHA." >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${DEPLOY_SHA}&per_page=100" \
            > "$RUNNER_TEMP/ci-runs.json"
          jq -e --arg sha "$DEPLOY_SHA" \
            'any(.workflow_runs[]; .head_sha == $sha and .conclusion == "success")' \
            "$RUNNER_TEMP/ci-runs.json" >/dev/null || {
              echo "No successful CI run found for $DEPLOY_SHA" >&2
              exit 1
            }

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Deploy API to the production FastAPI Cloud app
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_PROD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_PROD_APP_ID }}
        run: |
          set -euo pipefail
          test -n "$FASTAPI_CLOUD_TOKEN" || { echo "Set FASTAPI_CLOUD_PROD_TOKEN in the protected production environment" >&2; exit 1; }
          test -n "$FASTAPI_CLOUD_APP_ID" || { echo "Set FASTAPI_CLOUD_PROD_APP_ID in the protected production environment" >&2; exit 1; }
          uvx --from "fastapi[standard]" fastapi deploy --app-id "$FASTAPI_CLOUD_APP_ID"

      - name: Verify production API health (read-only)
        env:
          BASE: ${{ vars.FS_PROD_BACKEND_URL || 'https://fs-prod-api.fastapicloud.dev' }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "$BASE/healthz" \
                -o "$RUNNER_TEMP/fs-prod-health.json"; then
              python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["status"] == "ok"' \
                "$RUNNER_TEMP/fs-prod-health.json"
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "Production API health check failed at $BASE/healthz" >&2
              exit 1
            fi
            sleep 10
          done
          curl --fail --silent --show-error "$BASE/version" \
            -o "$RUNNER_TEMP/fs-prod-version.json"
          python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["app"] == "Financial Statement"' \
            "$RUNNER_TEMP/fs-prod-version.json"

      # Prebuild the production frontend only after the protected environment
      # approval. The build is not a deployment; the API remains the first live
      # service updated, and the frontend is released only after API health passes.
      - name: Set up Node.js for the production frontend
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@65.3.1

      - name: Pull production Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_PROD_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_PROD_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROD_PROJECT_ID }}
          VERCEL_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "Set VERCEL_PROD_TOKEN in the protected production environment" >&2; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "Set VERCEL_PROD_ORG_ID in the protected production environment" >&2; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Set VERCEL_PROD_PROJECT_ID in the protected production environment" >&2; exit 1; }
          vercel pull --yes --environment=production

      - name: Build the production frontend without deploying
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_PROD_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_PROD_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROD_PROJECT_ID }}
          VERCEL_TELEMETRY_DISABLED: "1"
        run: vercel build --prod

      - name: Deploy prebuilt frontend to the production Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_PROD_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_PROD_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROD_PROJECT_ID }}
          VERCEL_TELEMETRY_DISABLED: "1"
        run: vercel deploy --prebuilt --prod

      - name: Verify the production frontend root and SPA deep link
        env:
          BASE: ${{ vars.FS_PROD_WEB_URL || 'https://fs-prod-web.vercel.app' }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "$BASE" -o "$RUNNER_TEMP/fs-prod-web.html" &&
               grep -q '<div id="root"></div>' "$RUNNER_TEMP/fs-prod-web.html" &&
               curl --fail --silent --show-error "$BASE/login" -o "$RUNNER_TEMP/fs-prod-web-login.html" &&
               grep -q '<div id="root"></div>' "$RUNNER_TEMP/fs-prod-web-login.html"; then
              echo "Production frontend root and SPA deep-link are responding at $BASE"
              exit 0
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "Production frontend root or SPA deep-link check failed at $BASE" >&2
              exit 1
            fi
            sleep 10
          done
