openapi: 3.1.0
info:
  title: Financial Statement API
  description: 'AI-assisted financial statements & tax filing platform.


    **Contract-first:** this file is the single source of truth for the frontend client and backend tests. Deterministic
    core (statements, validation, workflow) computes all figures; AI endpoints (`tags: ai`) only explain/draft/suggest
    and are logged to `ai_requests`. Roles: `preparer` (owns companies/filings) and `reviewer` (review workflow).
    All endpoints under `/api` require `Bearer` auth except `/api/auth/register`, `/api/auth/login`, `/healthz`,
    `/version`.'
  version: 0.1.0
  x-project: DataTalksClub AI Dev Tools Zoomcamp 2026 — Final Project
